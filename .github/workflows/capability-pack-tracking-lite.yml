# Tracking Lite Capability Pack build and verification.
#
# Deliberately SEPARATE from CI: `workers/tracking-lite` is a standalone artifact
# project, not a workspace member, and its OpenCV dependency must never enter the
# base application's environment. The main CI job therefore never installs the
# `cv` extra, and this workflow never builds the base app.
#
# Three tiers, all required before an artifact may be signed:
#   1. protocol/policy suite — no third-party dependency at all
#   2. decoded-media pixel proof — real encoded video through the OpenCV backend
#   3. license/SBOM drift check — the shipped record must match what resolves
name: Capability Pack — Tracking Lite

on:
  pull_request:
    paths:
      - 'workers/tracking-lite/**'
      - '.github/workflows/capability-pack-tracking-lite.yml'
  push:
    branches: [main]
    paths:
      - 'workers/tracking-lite/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pack-tracking-lite-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: workers/tracking-lite

jobs:
  # Tier 1 runs everywhere and proves the worker's own logic needs no CV stack.
  protocol-and-policy:
    name: Protocol and policy (no CV stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Unit suite
        run: uv run --python 3.13 --with pytest --no-project pytest -q
      - name: Lint
        run: uv run --python 3.13 --with ruff --no-project ruff check .
      - name: Typecheck
        run: uv run --python 3.13 --with mypy --no-project mypy
      - name: Base app must not depend on this worker
        # A regression here would put OpenCV inside the base installer, which is
        # the entire thing the Capability Pack architecture exists to prevent.
        working-directory: .
        run: |
          if grep -rn "framepilot_tracking_lite\|tracking-lite" \
              --include='*.py' engine/python/framepilot_engine; then
            echo "::error::the base render engine must never import the Tracking Lite worker"
            exit 1
          fi
          if grep -n '"workers/' pnpm-workspace.yaml pyproject.toml; then
            echo "::error::the worker must not be a workspace member"
            exit 1
          fi

  # Tier 2 + 3 run per shipped platform, because the artifact is platform bound.
  decoded-media:
    name: Decoded-media proof (${{ matrix.platform }})
    needs: protocol-and-policy
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14 # Apple Silicon
            platform: darwin-arm64
          - runner: windows-latest
            platform: win32-x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - name: Install the CV extra from the exact lock
        run: uv sync --extra cv --no-dev --locked --python 3.13
      - name: Pixel proof against real decoded media
        run: uv run --extra cv --no-dev --with pytest pytest -m decoded_media -q
      - name: License and SBOM record must match the resolved environment
        run: uv run --extra cv --no-dev python tools/generate_sbom.py --check
      - name: Regenerate the platform SBOM
        run: uv run --extra cv --no-dev python tools/generate_sbom.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: tracking-lite-sbom-${{ matrix.platform }}
          path: workers/tracking-lite/pack/sbom/${{ matrix.platform }}.cdx.json
