# Desktop release pipeline (plan Phase 8 "Production packaging completion";
# ADR 0062/0063). Builds self-contained installers per OS/arch — the PyInstaller
# engine bundle is native, so each target needs its own builder.
#
# Trigger: push a version tag (v1.2.3) or run manually. Artifacts land on a
# DRAFT GitHub Release for that tag — a human reviews, smoke-tests per the
# release checklist (docs/guides/release-checklist-v1.md), and publishes.
#
# Signing/notarization secrets (all optional — builds are unsigned without them):
#   macOS:  MAC_CERT_P12 (base64 .p12), MAC_CERT_PASSWORD, CSC_NAME
#           (identity name; also drives scripts/sign-engine.mjs deep-signing),
#           APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarytool)
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD
#
# Update feed publishing (optional — artifacts still reach the draft release
# without it). The client reads the `generic` feed URL baked into
# electron-builder.yml, so the storage backend is decoupled from the client:
# point the feed hostname at whichever bucket these credentials address.
#   DIST_BUCKET      target bucket, e.g. framepilot-updates
#   DIST_ENDPOINT    S3-compatible endpoint (Cloudflare R2, Spaces, Backblaze);
#                    omit for AWS S3 itself
#   DIST_PREFIX      key prefix matching the feed URL path, default "desktop"
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_DEFAULT_REGION
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the draft release + upload assets

env:
  PNPM_VERSION: '9.12.0'
  NODE_VERSION: '22.15.0'
  PYTHON_VERSION: '3.11'

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
          - name: macOS x64
            os: macos-13
          - name: Windows x64
            os: windows-2022
          - name: Linux x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      # Hoisted to job level: a step's `if:` cannot see that same step's own
      # `env:` block, only env set at workflow/job level or by earlier steps —
      # so these must live here, not in the steps that used to declare them.
      MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
      DIST_BUCKET: ${{ secrets.DIST_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Linux AppImage/deb toolchain deps.
      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # Import the Developer ID cert so BOTH electron-builder and
      # scripts/sign-engine.mjs (deep-signs Resources/engine) can sign.
      - name: Import macOS signing certificate
        # GitHub does not allow the `secrets` context directly in an `if` expression. Project it
        # through the step environment so the workflow remains valid when signing is unconfigured.
        if: runner.os == 'macOS' && env.MAC_CERT_P12 != ''
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ env.MAC_CERT_P12 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}

      - run: pnpm install --frozen-lockfile

      # electron-builder's dmg-builder shells out to `which python`; macOS
      # machines often ship only `python3`. PYTHON_PATH is its documented
      # override (harmless if `python` exists).
      - name: Provide python for dmg-builder (macOS)
        if: runner.os == 'macOS'
        run: echo "PYTHON_PATH=$(which python3)" >> "$GITHUB_ENV"

      - name: Build installers
        run: pnpm desktop:dist
        env:
          # macOS deep-sign + electron-builder identity (unsigned when unset).
          CSC_NAME: ${{ secrets.CSC_NAME }}
          # macOS notarization (skipped by electron-builder when unset).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Authenticode (unsigned when unset).
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}

      # ADR 0114's hard line: no CV/ML payload inside the base installer. A leak
      # is silent — the build succeeds and the download just doubles — so it is
      # checked on every build rather than trusted to review.
      - name: Base installer must carry no Capability Pack payload
        run: node scripts/check-installer-budget.mjs --dir apps/desktop/release

      # A malformed feed is the worst thing this pipeline can publish: clients
      # trust it completely, and one that names a missing or hash-mismatched file
      # breaks auto-update for everyone already installed. Verified before any
      # upload, on every build — including manual runs, where catching it is free.
      - name: Verify the update feed is internally consistent
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            node scripts/verify-update-feed.mjs --dir apps/desktop/release --version "${TAG#v}"
          else
            node scripts/verify-update-feed.mjs --dir apps/desktop/release
          fi

      - name: Upload artifacts to draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --draft --title "$TAG" --notes "Draft — see CHANGELOG.md" 2>/dev/null || true
          shopt -s nullglob
          FILES=(apps/desktop/release/*.dmg apps/desktop/release/*.zip apps/desktop/release/*.exe apps/desktop/release/*.AppImage apps/desktop/release/*.deb apps/desktop/release/*.blockmap apps/desktop/release/latest*.yml)
          gh release upload "$TAG" "${FILES[@]}" --clobber

      # Publishing to the feed host is what actually reaches existing users; the
      # draft release above is for humans. Ordered deliberately: installers go up
      # first and latest*.yml last, so the feed never points at a file that has
      # not finished uploading. Skipped entirely when unconfigured.
      - name: Publish to the update feed host
        if: startsWith(github.ref, 'refs/tags/') && env.DIST_BUCKET != ''
        shell: bash
        env:
          DIST_ENDPOINT: ${{ secrets.DIST_ENDPOINT }}
          DIST_PREFIX: ${{ secrets.DIST_PREFIX }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'auto' }}
        run: |
          set -euo pipefail
          PREFIX="${DIST_PREFIX:-desktop}"
          ENDPOINT_ARG=""
          if [[ -n "${DIST_ENDPOINT:-}" ]]; then ENDPOINT_ARG="--endpoint-url ${DIST_ENDPOINT}"; fi
          cd apps/desktop/release
          # shellcheck disable=SC2086
          aws s3 sync . "s3://${DIST_BUCKET}/${PREFIX}/" $ENDPOINT_ARG \
            --exclude '*' \
            --include '*.dmg' --include '*.zip' --include '*.exe' \
            --include '*.AppImage' --include '*.deb' --include '*.blockmap' \
            --cache-control 'public, max-age=31536000, immutable'
          # The feed is a moving pointer, so it must never be cached long.
          for feed in latest*.yml; do
            [[ -e "$feed" ]] || continue
            # shellcheck disable=SC2086
            aws s3 cp "$feed" "s3://${DIST_BUCKET}/${PREFIX}/${feed}" $ENDPOINT_ARG \
              --cache-control 'public, max-age=60, must-revalidate' \
              --content-type 'text/yaml'
          done

      - name: Upload artifacts (manual run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/latest*.yml
          if-no-files-found: error
