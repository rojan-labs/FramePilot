name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Public pull requests must receive the smallest possible GITHUB_TOKEN. Jobs in
# this workflow only read repository content and upload Actions artifacts.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: '9.12.0'
  NODE_VERSION: '22.15.0'
  PYTHON_VERSION: '3.11'

jobs:
  # ── Node / TypeScript quality gates ──────────────────────────────────────
  node-quality:
    name: TS typecheck · lint · unit tests · coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # - run: pnpm format:check
      # Capped concurrency: the GitHub-hosted runner's 2 vCPUs can't sustain
      # turbo's default per-package parallelism across coverage-instrumented
      # vitest workers for all 11 packages at once, which intermittently
      # corrupts module resolution for workspace packages under contention
      # (a function that exists in source resolves to undefined at runtime).
      - run: pnpm exec turbo run test:coverage --concurrency=4
      # MK4.6 budgets, uninstrumented and alone (coverage multiplies CPU-bound timings).
      - name: MK4.6 budgets
        env:
          FRAMEPILOT_RUN_PERF: '1'
        run: |
          pnpm --filter @framepilot/timeline-schema exec vitest run src/save-budget.perf.test.ts
          pnpm --filter @framepilot/web-editor exec vitest run src/components/preview/MaskCanvasTools.perf.test.tsx
          pnpm --filter @framepilot/desktop exec vitest run electron/capability-packs/segment-frame.test.ts -t 'hover latency'
      # AM5 AI masking eval. It recomputes reports/ai-masking/eval.json (a file snapshot, so a
      # drifted number fails) and asserts the safety gates. The numbers go on the run page.
      - name: AM5 AI masking eval
        run: |
          pnpm --filter @framepilot/desktop exec vitest run electron/ai/masking-eval/masking-eval.test.ts
          node -e "
            const s = require('./reports/ai-masking/eval.json').summary;
            const shown = { gates: s.gates, targetAccuracyByRequirement: s.targetAccuracyByRequirement,
              needsClickRate: s.needsClickRate, faceSelectionRate: s.faceSelectionRate,
              adversarialHeld: s.adversarialHeld };
            const text = JSON.stringify(shown, null, 2);
            console.log(text);
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '### AI masking eval (AM5)\n\`\`\`json\n' + text + '\n\`\`\`\n');
          "
      # - name: Upload coverage report
      #   if: always()
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: node-coverage
      #     path: reports/coverage

  # ── Python engine quality gates ──────────────────────────────────────────
  python-engine:
    name: Python typecheck · lint · tests · render fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Sync deps
        working-directory: engine/python
        run: uv sync --extra dev
      - name: Ruff
        working-directory: engine/python
        run: uv run ruff check .
      - name: Mypy
        working-directory: engine/python
        run: uv run mypy .
      - name: Pytest + coverage
        working-directory: engine/python
        # -n 3 for speed. It used to be load-bearing: the suite would kill a worker deep
        # into a run, reported against whatever unrelated test was executing (a render
        # test, a pure-Python one), with no Python exception — so it read as a resource
        # limit and was tuned around, 4 -> 3, rather than debugged.
        #
        # It was not a resource limit. `test_parent_watchdog.py` started a REAL watchdog
        # thread and returned without stopping it; that daemon thread ends in
        # `os._exit(1)` after its grace period, so ~60s later it took the whole worker
        # down, no traceback, arbitrary victim. Sharding only changed which worker died
        # and when. Fixed at the source: the watchdog is stoppable and the tests stop it.
        run: uv run pytest -n 3 --cov --cov-report=xml --cov-report=term
      - name: Render and validate fixture project
        working-directory: engine/python
        run: uv run pytest tests/test_render_pipeline.py::test_export_video_completes_and_validates -q

  # ── Mask rasteriser byte-equality on the other two desktop platforms (MK2.3) ──────────
  # The vectors must reproduce byte for byte on macOS arm64 and Windows x64 as well as Linux
  # x64 (covered by python-engine above). Only the vector tests run here: no ffmpeg, no renders.
  # MK3.1: the TypeScript preview twin (apps/web-editor/src/preview/masks/mask-raster.test.ts)
  # runs on Linux in node-quality and here on the other two platforms, because byte equality
  # of the preview mask on every desktop platform is a production budget, not a Linux fact.
  mask-raster-vectors:
    name: Mask rasteriser vectors · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Sync deps
        working-directory: engine/python
        run: uv sync --extra dev
      - name: Rasteriser vectors
        working-directory: engine/python
        run: uv run pytest tests/test_mask_raster_vectors.py tests/test_mask_raster.py tests/test_mask_stack_vectors.py tests/test_key_mask_vectors.py -q
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The stack vectors import editor-core (and its workspace deps) from their built dist. Only
      # the TypeScript build: editor-core's build script also writes a Linux-only parity file.
      - name: Build the packages the preview mask stack imports
        run: |
          pnpm exec turbo run build --filter=@framepilot/timeline-schema...
          pnpm --filter @framepilot/editor-core exec tsc -b
      # Every vector set that claims byte-equality with the engine, on every runtime the plan
      # names (plan 10, "Determinism rules"): shapes and the legacy blur, whole clip stacks,
      # the frame-space stacks of an adjustment lane (MK5.2), the matte finesse group (MK6.2),
      # and the key's colour charts (MK6.3, exact on the CPU twin).
      - name: Preview rasteriser vectors (TypeScript)
        working-directory: apps/web-editor
        run: pnpm exec vitest run src/preview/masks/mask-raster.test.ts src/preview/masks/legacy-mask.test.ts src/preview/masks/mask-stack.test.ts src/preview/masks/frame-masks.test.ts src/preview/masks/matte-edges.test.ts src/preview/masks/key-mask.test.ts

  # ── Cross-runtime professional-operation proof ─────────────────────────────────────
  professional-rendered-evals:
    name: Professional operations · 33 rendered proofs
    runs-on: ubuntu-latest
    needs: [node-quality, python-engine]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Sync engine dependencies
        working-directory: engine/python
        run: uv sync --extra dev
      - run: pnpm build
      - run: pnpm eval:professional:rendered

  # ── Golden gate: rubric + efficiency + goal.md metrics (plan/system-mission P9.3/P9.5, goal.md Phase 0) ──
  # One gate reads one committed run JSON and compares it to one committed floor
  # (`reports/golden/floor.json`). It is a pure JSON reduction — no provider, no sidecar,
  # no media — which is the whole reason it belongs in the PR lane: the expensive half
  # (producing a fresh run) is the nightly job in `mission-nightly.yml`, and what lands
  # here is its evidence.
  #
  # The run JSON is committed today, so this normally executes. It SKIPS (not fails)
  # when it is absent, because a checkout without a recorded run has nothing to say
  # about a regression and a red X that means "no data" trains people to ignore red.
  mission-gates:
    name: Golden gate (rubric + efficiency + goal.md metrics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The script is dependency-free Node and resolves its argument against the
      # repository root, so this job deliberately skips `pnpm install` entirely.
      # Locally the same command is `pnpm eval:golden:gate <run.json>`.
      - id: run
        name: Locate the committed run
        run: |
          if [ -f "$GOLDEN_RUN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GOLDEN_RUN: reports/golden/baseline.json
      - name: Golden gate
        if: steps.run.outputs.present == 'true'
        shell: bash
        run: |
          set -eo pipefail
          node packages/ai-sdk/scripts/golden-gate.mjs \
            reports/golden/baseline.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: No run to gate
        if: steps.run.outputs.present != 'true'
        run: |
          echo "No committed golden run JSON (reports/golden/baseline.json); gate skipped." \
            >> "$GITHUB_STEP_SUMMARY"

  # ── License & dependency review ──────────────────────────────────────────
  license-scan:
    name: License scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm license:scan

  # ── E2E smoke tests (functional flows; PRD §16.1) ────────────────────────
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    needs: [node-quality]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter @framepilot/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: reports/e2e

  # ── Preview/export pixel parity oracle (PX4, plan/background-removal-ai/09) ──
  # Renders every frame-plan matrix sample through the export compositor (lossless
  # frame_grab), then seeks the editor's WebCodecs monitor to the same times in real
  # Chrome and compares pixels, sentinel layer colours and presented source pts. No GPU
  # on the runner: Chrome falls back to SwiftShader, with the SAME thresholds. Known
  # failures are test.fail() entries in tests/e2e/fixtures/preview-parity-baseline.json;
  # a listed case that starts passing fails this job so the list only shrinks.
  # CI is the ONLY place the full oracle runs (a local run exhausted a workstation's memory).
  preview-parity-oracle:
    name: Preview/export parity oracle (PX4)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Independent of node-quality on purpose: the oracle's evidence (the baseline) must not
    # wait on an unrelated unit-test failure elsewhere on the branch.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Sync engine dependencies
        working-directory: engine/python
        run: uv sync --extra dev
      - run: pnpm build
      - name: Install Google Chrome for Playwright
        run: pnpm --filter @framepilot/e2e exec playwright install --with-deps --force chrome
      - name: Generate synthetic media and engine frames
        # Memory-bounded (the generator's module note): one case per process and a hard cap
        # under the runner's 16 GB. One worker: the every-transition-kind case alone opens a
        # reader per clip, and two workers measured 8 GB peak on that case.
        run: pnpm px4:frames --workers 1 --max-rss-mb 10000
      - name: Start the engine sidecar (text rasters, as the desktop monitor uses)
        working-directory: engine/python
        run: |
          nohup uv run framepilot serve --host 127.0.0.1 --port 8799 > "$RUNNER_TEMP/sidecar.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8799/health && break; sleep 1; done
      - name: Run the parity oracle
        env:
          PX4_SIDECAR_URL: http://127.0.0.1:8799
        run: pnpm --filter @framepilot/e2e test:parity
      - name: Summarise results
        if: always()
        run: |
          if [ -d tests/e2e/.tmp-px4-parity/results ]; then
            node tests/e2e/scripts/px4-baseline.mjs >> "$GITHUB_STEP_SUMMARY"
          fi
      # Always: the committed baseline (PX4-BASELINE.md, preview-parity-baseline.json) is
      # regenerated from this artifact, never from a local run.
      - name: Upload parity results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-parity-results
          include-hidden-files: true
          path: tests/e2e/.tmp-px4-parity/results
      - name: Upload parity report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: preview-parity-oracle
          path: |
            reports/e2e
            reports/e2e-results

  # ── Masking end to end (plan/background-removal-ai/07, E2E.1–E2E.8) ──────────────────
  # The real editor in desktop mode (web build in real Chrome, `window.framepilot` installed by
  # the spec) against the REAL desktop host modules from apps/desktop/dist (matte IPC, relink
  # re-check, matte validation, project file layer) and the REAL engine (frame grab, export,
  # validation, sidecar text rasters and decoded-frame hashes). Simulated: Electron itself,
  # fp-media://, signed pack installs and the pack workers' models — each spec's header says
  # which, and why. Preview == export uses the PX4 oracle's own comparison and gates.
  masking-e2e:
    name: Masking end to end (E2E.1–E2E.8)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Sync engine dependencies
        working-directory: engine/python
        run: uv sync --extra dev
      # E2E.6 runs the real Smart Mask pipeline (windows, checkpoints, encoders) with the worker
      # suite's scripted models: the worker's `cv` extra, never its weights.
      - name: Sync the Smart Mask worker (scripted models, no weights)
        working-directory: workers/smart-mask
        run: uv sync --extra cv --locked --python 3.13
      - run: pnpm build
      - name: Install Google Chrome for Playwright
        run: pnpm --filter @framepilot/e2e exec playwright install --with-deps --force chrome
      - name: Start the engine sidecar (sandboxed to the specs' workspaces, as the desktop does)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/e2e/.tmp-masking-e2e"
          cd engine/python
          FRAMEPILOT_PROJECTS_ROOT="$GITHUB_WORKSPACE/tests/e2e/.tmp-masking-e2e" \
            nohup uv run framepilot serve --host 127.0.0.1 --port 8799 > "$RUNNER_TEMP/sidecar.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8799/health && break; sleep 1; done
      - name: Run the masking end-to-end specs
        env:
          MASKING_E2E_SIDECAR_URL: http://127.0.0.1:8799
        run: pnpm --filter @framepilot/e2e test:masking
      - name: Collect the sidecar log
        if: always()
        run: cp "$RUNNER_TEMP/sidecar.log" reports/e2e-results/masking-sidecar.log || true
      # Always: the report carries each spec's parity numbers and bridge diagnostics.
      - name: Upload the masking end-to-end report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: masking-e2e-report
          path: |
            reports/e2e
            reports/e2e-results

  # ── Elements end to end (plan/elements EL4a) ───────────────────────────────────────────────
  # The masking job's harness (fake desktop in real Chrome + the real engine sidecar) driving the
  # Shapes flow: add from the Elements tab, resize on the monitor, recolour, export, the monitor
  # compared with the export at the PX4 gates, undo. Stickers join in EL6a.
  elements-e2e:
    name: Elements end to end (shapes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Sync engine dependencies
        working-directory: engine/python
        run: uv sync --extra dev
      - run: pnpm build
      - name: Install Google Chrome for Playwright
        run: pnpm --filter @framepilot/e2e exec playwright install --with-deps --force chrome
      - name: Start the engine sidecar (sandboxed to the specs' workspaces, as the desktop does)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/e2e/.tmp-masking-e2e"
          cd engine/python
          FRAMEPILOT_PROJECTS_ROOT="$GITHUB_WORKSPACE/tests/e2e/.tmp-masking-e2e" \
            nohup uv run framepilot serve --host 127.0.0.1 --port 8799 > "$RUNNER_TEMP/sidecar.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8799/health && break; sleep 1; done
      - name: Run the Elements end-to-end specs
        env:
          MASKING_E2E_SIDECAR_URL: http://127.0.0.1:8799
        run: pnpm --filter @framepilot/e2e test:elements
      - name: Collect the sidecar log
        if: always()
        run: cp "$RUNNER_TEMP/sidecar.log" reports/e2e-results/elements-sidecar.log || true
      - name: Upload the Elements end-to-end report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: elements-e2e-report
          path: |
            reports/e2e
            reports/e2e-results

  # ── E2E.7: a project with masks, mattes and tracks moves between macOS and Windows ────────
  # plan/background-removal-ai/07 E2E.7 (audit P14). The folder is built, exported and its
  # reference frames recorded on one OS (`tests.masking_archive create`), handed over as an
  # artifact, and reopened on the other: the desktop's own open path and FULL matte validation
  # (`tests/e2e/scripts/masking-archive-open.mjs`), then the engine export compared with the
  # reference at the PX4 gates (`tests.masking_archive reopen`). Bit-identity across platforms is
  # reported, not required: the export decoder builds differ by platform. Same-platform
  # reopen and the incomplete-archive refusal run in the masking-e2e job.
  masking-archive-create:
    name: Masking archive · build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ffmpeg (ffprobe reads the source timing)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else choco install ffmpeg -y --no-progress; fi
      - name: Sync engine dependencies
        working-directory: engine/python
        run: uv sync --extra dev
      - name: Build the archive and its reference
        working-directory: engine/python
        shell: bash
        run: uv run python -m tests.masking_archive create "$RUNNER_TEMP/masking-archive"
      - uses: actions/upload-artifact@v7
        with:
          name: masking-archive-${{ runner.os }}
          path: ${{ runner.temp }}/masking-archive
          # The mattes and tracks live in the project's `.framepilot-derived/`; upload-artifact
          # leaves dot-folders out unless told, which is exactly the incomplete archive the
          # reopen check refuses.
          include-hidden-files: true

  masking-archive-reopen:
    name: Masking archive · made on ${{ matrix.from }}, reopened on ${{ matrix.os }}
    needs: masking-archive-create
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, from: macOS }
          - { os: macos-14, from: Windows }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ffmpeg (ffprobe for the matte validation)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else choco install ffmpeg -y --no-progress; fi
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # TypeScript only: some packages' build scripts also write Linux-only generated files
      # (editor-core's frame-grid parity), which fail on Windows paths. The desktop build is
      # itself only `tsc`.
      - name: Build the desktop host modules the open check imports
        run: |
          pnpm --filter "@framepilot/desktop^..." exec tsc -b
          pnpm --filter @framepilot/desktop run build
      - name: Sync engine dependencies
        working-directory: engine/python
        run: uv sync --extra dev
      - uses: actions/download-artifact@v7
        with:
          name: masking-archive-${{ matrix.from }}
          path: ${{ runner.temp }}/moved/archive
      - name: Open it as the desktop does (paths, artifacts, full matte validation)
        shell: bash
        run: node tests/e2e/scripts/masking-archive-open.mjs "$RUNNER_TEMP/moved/archive/project/project.fp.json"
      - name: Export it and compare with the reference made on ${{ matrix.from }}
        working-directory: engine/python
        shell: bash
        run: uv run python -m tests.masking_archive reopen "$RUNNER_TEMP/moved/archive"

  # ── PX5: performance evidence for the layer compositor on the Scale row ───────────────
  # plan/background-removal-ai/PX5-BUDGETS.md. This runner has no GPU (SwiftShader) and few
  # cores, so it GATES on the algorithm's invariants only (decoder pool cap, cache bound, GL
  # pools flat, no layer shed) and LOGS the timings; the 1% / 100 ms budgets are asserted on
  # real hardware with PX5_ASSERT=budgets. Everything is generated here: no media is committed.
  preview-perf:
    name: Preview performance evidence (PX5)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - name: Sync engine dependencies
        working-directory: engine/python
        run: uv sync --extra dev
      - run: pnpm build
      - name: Install Google Chrome for Playwright
        run: pnpm --filter @framepilot/e2e exec playwright install --with-deps --force chrome
      - name: Generate the Scale fixture (3 min, 4K, 4 sources + proxies + a 4K matte)
        run: pnpm px5:fixture
      - name: CPU measurements (mask raster, 4K matte decode and main-thread cost)
        env:
          FRAMEPILOT_RUN_PERF: '1'
        run: |
          pnpm --filter @framepilot/web-editor exec vitest run --no-file-parallelism \
            src/preview/masks/mask-raster.perf.test.ts \
            src/preview/decode/matte-decode.perf.test.ts \
            src/preview/masks/matte-composite.perf.test.ts
      - name: pts probe on a multi-GB file and a two-hour file
        run: pnpm px5:pts-probe
      - name: Export with masks and a 4K matte vs without (P13, 4-second window)
        run: pnpm px5:export-ratio --window-seconds 4
      - name: Scale row in the editor (invariants gate; timings are logged)
        env:
          FRAMEPILOT_RUN_PERF: '1'
          PX5_PLAY_SECONDS: '15'
          PX5_SEEKS: '12'
        run: pnpm --filter @framepilot/e2e test:perf
      - name: Summarise
        if: always()
        run: |
          if [ -d tests/e2e/.tmp-px5-scale/results ]; then
            node tests/e2e/scripts/px5-summary.mjs >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload PX5 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-perf-results
          include-hidden-files: true
          path: tests/e2e/.tmp-px5-scale/results

  # ── E2E visual regression (platform-specific screenshot baselines) ────────
  e2e-visual:
    name: E2E visual regression
    # Visual baselines are intentionally platform-specific; the committed golden set is macOS.
    runs-on: macos-latest
    needs: [node-quality]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm --filter @framepilot/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @framepilot/e2e test:visual
      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: reports/e2e

  # ── Desktop build ────────────────────────────────────────────────────────
  desktop-build:
    name: Build desktop app
    runs-on: ubuntu-latest
    needs: [node-quality]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
