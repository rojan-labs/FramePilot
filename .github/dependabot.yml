version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: "Asia/Kathmandu"
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: uv
    directory: /engine/python
    schedule:
      interval: weekly
      day: monday
      time: "03:15"
      timezone: "Asia/Kathmandu"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: "Asia/Kathmandu"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
