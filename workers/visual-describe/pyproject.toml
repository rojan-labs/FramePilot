# Visual Describe Capability Pack worker.
#
# A SEPARATE artifact project, on the same terms as workers/visual-embed: not a member of
# the root uv workspace, not a dependency of the base Python render engine or the Electron
# app. Model weights and native runtimes ship as signed, on-demand Capability Packs
# (docs/adr/0114-on-demand-capability-packs.md), never inside the base installer. Nothing
# here may be imported by `framepilot_engine`.
#
# THERE IS NO ML PYTHON DEPENDENCY AT ALL. The runtime is llama.cpp's own
# `llama-mtmd-cli` binary (MIT), driven as a subprocess exactly the way the ASR path
# already drives `whisper-cli`. The only optional dependency is OpenCV, and only to decode
# keyframes; it is behind the `cv` extra so the whole suite runs with no ML stack.
[project]
name = "framepilot-visual-describe"
version = "1.0.0"
description = "FramePilot Visual Describe Capability Pack worker (structured per-shot descriptions from a local VLM)"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "Rojan Acharya and FramePilot contributors" }]
requires-python = ">=3.12"
# The protocol/schema/policy/runtime layer has NO third-party dependency, so the base
# repository can test this worker without OpenCV, llama.cpp or a downloaded weight.
dependencies = []

[project.optional-dependencies]
# Real backend. Installed only by the pack build/CI job. `llama-mtmd-cli` is a BINARY
# fetched by tools/fetch_models.py, not a Python distribution — it is not listed here.
cv = [
  "numpy>=2.1",
  "opencv-contrib-python-headless>=5.0,<6",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
framepilot-visual-describe = "framepilot_visual_describe.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framepilot_visual_describe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# The default suite runs with no ML stack, no llama.cpp binary and no downloaded weights.
# Real inference proof is opt-in and runs in the pack build job.
addopts = "-ra --strict-markers -m 'not decoded_media'"
markers = [
  "decoded_media: requires OpenCV, the pinned llama.cpp binary and weights, and real media (pack build job only)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "RUF"]
allowed-confusables = ["–"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/framepilot_visual_describe", "tests"]

[[tool.mypy.overrides]]
module = ["cv2.*", "numpy.*"]
ignore_missing_imports = true
