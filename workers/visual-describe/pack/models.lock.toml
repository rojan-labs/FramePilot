# Pinned artifacts for the Visual Describe Capability Pack.
#
# WHY THIS FILE EXISTS
#
# Weights and native binaries have their own licences and their own provenance. They are
# deliberately NOT committed to this repository: they are fetched at pack build time from
# a URL pinned to an immutable revision and verified against the exact sha256 recorded
# here. An artifact that does not hash to its pin is refused, so a silently re-uploaded or
# tampered model — or a swapped runtime binary — cannot enter a signed pack.
#
# EVERY DIGEST BELOW IS A PLACEHOLDER AND THIS PACK CANNOT LOAD A MODEL.
#
# Nothing here has been downloaded: this worker was built without fetching an artifact, on
# purpose, so the pack machinery could be reviewed before ~1.6 GiB of binaries entered the
# picture. `sha256 = "000…0"` is the sentinel for "not yet fetched"; the worker's
# `models.py` refuses it by name and the health check fails while any remains. Making this
# pack live is one mechanical step: run `tools/fetch_models.py --record`, which downloads
# each URL, prints its digest, and writes it back here — then copy the same digests into
# `src/framepilot_visual_describe/models.py`, which is the copy the SIGNED WHEEL enforces.
#
# WHY THESE ARTIFACTS (licence table: plan/visual-understanding/08-REMOVE-DEFER-RISKS.md)
#
#  1. Licence. llama.cpp is MIT; SmolVLM2 is Apache-2.0. Both the GGUF QUANTISATION and
#     the mmproj export must be licence-verified as well as the upstream model card — a
#     re-quantised or re-exported artifact can be published under other terms, and the
#     licence that governs this pack is the one on the file the build job downloads.
#     Excluded on licence grounds, decided and not to be re-opened: Qwen2.5-VL
#     (research-only terms) and Gemma 3 (Gemma terms). Neither may be the default nor an
#     option.
#  2. Runtime. `llama-mtmd-cli` is the same ggml family as the `whisper-cli` the ASR path
#     already ships, so this pack adds NO new Python ML runtime — its only Python
#     dependency is OpenCV, which this project has already licence-audited and shipped for
#     Tracking Lite, Subject Intelligence and Visual Embed.
#  3. Size. ~1.6 GiB against a pack budget that anticipated 150 MiB–1.5 GiB, and nothing
#     enters the base installer either way. The 500 M pair exists so a machine under
#     12 GB describes its footage slightly worse rather than not at all.

schemaVersion = 1

[runtimeSource]
# The llama.cpp release the runtime is taken from.
#
# WHY AN ARCHIVE AND NOT A BINARY: llama.cpp publishes no bare `llama-mtmd-cli` asset —
# never has. Each release ships one tarball per platform, and the CLI inside it is
# dynamically linked against nine ggml/llama dylibs whose only search path is
# `@loader_path`. A URL ending in `/llama-mtmd-cli` 404s on every release that exists.
#
# `release` is NOT `/releases/latest`: that tag on this repository is a version marker
# carrying a single text file. The builds live on the rolling `bNNNNN` tags, and
# `--record` resolves to the newest one that actually publishes this platform's asset.
repository = "https://github.com/ggml-org/llama.cpp"
release = "b10840"
baseUrl = "https://github.com/ggml-org/llama.cpp/releases/download/b10840"

[source]
# SmolVLM2 GGUF artifacts, fetched from the Hugging Face repository at a pinned revision.
repository = "https://huggingface.co/ggml-org/SmolVLM2-2.2B-Instruct-GGUF"
revision = "1bc3c9f74ceafd4c8d4411cc9cf188bba3798f91"
baseUrl = "https://huggingface.co/ggml-org/SmolVLM2-2.2B-Instruct-GGUF/resolve/1bc3c9f74ceafd4c8d4411cc9cf188bba3798f91"

[smallSource]
repository = "https://huggingface.co/ggml-org/SmolVLM2-500M-Video-Instruct-GGUF"
revision = "ccd7aae53bcb1997355c2f094959e72b3642ce17"
baseUrl = "https://huggingface.co/ggml-org/SmolVLM2-500M-Video-Instruct-GGUF/resolve/ccd7aae53bcb1997355c2f094959e72b3642ce17"

[[archive]]
# The whole release tarball is pinned by ONE digest before a single byte is unpacked. That
# is the strongest form of this pin available: it covers the CLI, all nine dylibs and the
# MIT LICENSE together, so no member can be swapped independently of the approval.
id = "llama-runtime"
name = "llama.cpp b10840 release build, macOS arm64"
file = "llama-runtime-macos-arm64.tar.gz"
path = "llama-{release}-bin-macos-arm64.tar.gz"
source = "runtimeSource"
sha256 = "848b6cc2817aa09e615fed0813b01fc3abbc43cd4d4773cc4aff4d7ef5733784"
bytes = 11137156
license = "MIT"
licenseVerified = false
licensePath = "llama-{release}/LICENSE"
copyright = "Georgi Gerganov and the ggml authors"
notes = "The Metal build. Verify the LICENSE inside this artifact, not only the repository's."

# The unversioned names `llama-mtmd-cli` asks its loader for. They are symlinks in the
# tarball, so they hold no content and hash to nothing of their own; what makes them safe
# is that the file each one points at IS pinned below.
[archive.links]
"libmtmd.0.dylib" = "libmtmd.0.4.0.dylib"
"libllama.0.dylib" = "libllama.0.4.0.dylib"
"libllama-common.0.dylib" = "libllama-common.0.4.0.dylib"
"libggml.0.dylib" = "libggml.0.23.0.dylib"
"libggml-base.0.dylib" = "libggml-base.0.23.0.dylib"
"libggml-cpu.0.dylib" = "libggml-cpu.0.23.0.dylib"
"libggml-blas.0.dylib" = "libggml-blas.0.23.0.dylib"
"libggml-metal.0.dylib" = "libggml-metal.0.23.0.dylib"
"libggml-rpc.0.dylib" = "libggml-rpc.0.23.0.dylib"

