# Pinned model files for the Smart Mask Capability Pack.
#
# WHY THIS FILE EXISTS
#
# The pack ships ONNX graphs derived from two upstream checkpoints. They are never committed:
# `tools/export_onnx.py` produces them at pack build time from the pinned checkpoints below
# (PyTorch is a build-time dependency only and never ships), and every produced file must
# hash to the digest recorded here and compiled into `src/framepilot_smart_mask/models.py`.
# A file that does not match is refused (`model_unavailable`).
#
# These digests are what the worker reports in `modelDigests` on every handshake and result,
# so an edit's evidence lineage names the exact graphs that produced a matte.
#
# WHY THESE MODELS: plan/background-removal-ai/02-WORKER-PACK.md and ADR 0179 (decided).
# PRECISION: SAM 2.1 ships fp32 (its fp16-stored export failed parity, BR0.2). BiRefNet ships
# fp16-stored / fp32-computed (passed parity at 768² on the CPU EP). A (model, EP) pair that
# fails parity is disabled by rule (models.py PARITY_TABLE).
#
# OPEN FINDING (BR0.5, carried forward, blocks shipping): BiRefNet_HR-matting training-data
# terms are unverified. See LICENSES.md.

schemaVersion = 1

[source.sam2]
