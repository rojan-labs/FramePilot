# BR0 verification spike for the Smart Mask pack (plan/background-removal-ai/02-WORKER-PACK.md).
# ISOLATED: not a member of any workspace, not a dependency of the engine, the app or the
# eventual pack. PyTorch lives here only because the parity reference and the ONNX export
# need it; it never ships in the pack. Weights/ONNX/media live in ../.cache (git-ignored).
[project]
name = "framepilot-smart-mask-spike"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.5.1",
  "torchvision",
  "numpy>=1.26",
  "onnx>=1.17",
  "onnxruntime>=1.20",
  "onnxscript",
  "opencv-contrib-python-headless>=4.10",
  "hydra-core>=1.3.2",
  "iopath>=0.1.10",
  "pillow",
  "tqdm",
  "timm",
  "kornia",
  "einops",
  "transformers",
  "safetensors",
  "psutil",
  "pytest",
]

[tool.uv]
package = false
