# electron-builder configuration for FramePilot desktop packaging + code signing
# (plan/PLAN.md Phase 8 — "Signed desktop builds (macOS/Windows/Linux), auto-update").
#
# Signing/notarization REQUIRE external secrets that are NOT in the repo. Supply
# them as CI secrets / local env (see docs/guides/release-checklist-v1.md):
#   macOS:   CSC_LINK (base64 .p12 Developer ID cert), CSC_KEY_PASSWORD,
#            APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID  (for notarytool)
#   Windows: CSC_LINK (.pfx) + CSC_KEY_PASSWORD, or an Azure Trusted Signing config
#   Updates: GH_TOKEN (or the chosen provider's token) to publish the update feed
#
# Without these, `pnpm --filter @framepilot/desktop dist` still produces UNSIGNED
# artifacts for local testing; CI release builds set the secrets and sign.
#
# Local macOS DMG builds: dmg-builder shells out to `which python`; if your
# machine has only `python3`, run with PYTHON_PATH="$(which python3)".
appId: com.framepilot.app
productName: FramePilot
copyright: Copyright © FramePilot
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - renderer/**
  - '!**/*.map'

# The self-contained Python engine (PyInstaller onedir bundle, staged by
# scripts/package-engine.mjs) ships OUTSIDE the asar under Resources/engine/ —
# it is a native executable tree that must be spawnable from disk.
# electron/sidecar/spawn.ts launches <resourcesPath>/engine/framepilot-engine
# in packaged builds. Signed/notarized releases: electron-builder does not
# deep-sign extraResources — scripts/sign-engine.mjs signs the bundle's Mach-O
# files at staging time (before they are copied here) when CSC_NAME is set.
extraResources:
  - from: engine-dist
    to: engine
  # Offline Ed25519 root public keys for the Capability Pack catalog. main.ts
  # reads this from <resourcesPath>/capability-pack-root-keys.json in packaged
  # builds. It is a GLOB on purpose: the file is generated by
  # `framepilot-pack generate-root-key` and is not committed, so dev and
  # unsigned builds simply ship without it and every pack proposal fails closed
  # — which is the safe direction. A release build must have it, or the app can
  # install no packs at all.
  - 'build/capability-pack-root-keys.json'

# Auto-update feed. electron-updater reads this provider to find new versions.
# `generic` points at a static host; switch to `github` to publish GitHub Releases.
publish:
  provider: generic
  url: https://updates.framepilot.ai/desktop
  channel: stable

mac:
  category: public.app-category.video
  icon: build/icon.png # electron-builder derives the .icns from this 1024x1024 source
  hardenedRuntime: true # required for notarization
  gatekeeperAssess: false
  # The engine bundle is signed at STAGING time (scripts/sign-engine.mjs, file-
  # level Mach-O signatures — the layout PyInstaller supports). electron-builder
  # must not walk it: codesign rejects signing PyInstaller's Python.framework
  # as a framework bundle ("unsealed contents in the root directory"), which
  # aborts the whole build whenever a keychain identity is auto-discovered.
  # The outer app signature still seals these files as resources.
  signIgnore:
    - 'Resources/engine/'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true # uses APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  target:
    - dmg
    - zip # zip target is required for macOS auto-update

win:
  icon: build/icon.png # electron-builder derives the .ico from this 1024x1024 source
  # Signing via CSC_LINK/CSC_KEY_PASSWORD env, or configure Azure Trusted Signing.
  target:
    - nsis

linux:
  category: AudioVideo
  icon: build/icon.png
  target:
    - AppImage # AppImage supports electron-updater auto-update
    - deb

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
